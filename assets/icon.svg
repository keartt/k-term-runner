<!-- 앱 아이콘 원본: 터미널 창 + ❯ K _ (글꼴에 의존하지 않도록 글자도 선으로 그림) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e293b" />
      <stop offset="1" stop-color="#0b1120" />
    </linearGradient>
  </defs>
  <!-- 바탕: mac 아이콘 규격처럼 가장자리 여백 100 + 둥근 사각형 -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" />
  <rect x="100" y="100" width="824" height="824" rx="185" fill="none" stroke="#334155" stroke-width="8" />
  <!-- 창 제목줄 점 3개 -->
  <circle cx="215" cy="215" r="24" fill="#ff5f57" />
  <circle cx="290" cy="215" r="24" fill="#febc2e" />
  <circle cx="365" cy="215" r="24" fill="#28c840" />
  <line x1="100" y1="290" x2="924" y2="290" stroke="#334155" stroke-width="8" />
  <!-- 프롬프트 ❯ -->
  <polyline points="240,440 370,560 240,680" fill="none" stroke="#22c55e" stroke-width="64" stroke-linecap="round" stroke-linejoin="round" />
  <!-- K -->
  <g stroke="#e2e8f0" stroke-width="64" stroke-linecap="round" stroke-linejoin="round">
    <line x1="470" y1="430" x2="470" y2="690" />
    <line x1="470" y1="590" x2="630" y2="430" />
    <line x1="545" y1="515" x2="640" y2="690" />
  </g>
  <!-- 커서 _ -->
  <rect x="690" y="650" width="130" height="44" rx="8" fill="#22c55e" />
</svg>
